name: Rust

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The crates that build and test on Windows. Utilities are ported a whole
  # crate at a time, because `cargo test -p` builds every binary in the
  # crate; add a crate here once all of its binaries and tests are portable.
  WINDOWS_CRATES: -p gettext-rs -p plib -p posixutils-xform -p posixutils-text

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          # First pass: show all warnings (don't fail)
          cargo clippy --all-targets 2>&1 || true
          # Second pass: fail if any warnings exist
          cargo clippy --all-targets -- -D warnings
      # The Windows code paths, linted here without a Windows runner.
      - name: Clippy (Windows target)
        run: cargo clippy --target x86_64-pc-windows-msvc $WINDOWS_CRATES --all-targets -- -D warnings

  # The declared minimum Rust (Cargo.toml's rust-version) has to build the
  # workspace. The other jobs use the latest stable, so a dependency or a
  # language feature that raises the floor would otherwise go unnoticed.
  msrv:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check the workspace
        run: cargo check --workspace --all-targets
      - name: Check the Windows crates
        run: cargo check --target x86_64-pc-windows-msvc $WINDOWS_CRATES --all-targets

  linux-ubuntu:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System info
        run: |
          echo "=== Architecture ==="
          uname -a
          echo "=== CPU ==="
          lscpu | head -20
          echo "=== Toolchain ==="
          rustc --version
          cargo --version
          cc --version || true
          as --version || true
      - name: Fetch
        run: cargo fetch
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose

  # aarch64 Linux. The only place `long double` is IEEE binary128 -- macOS
  # makes it a 64-bit double and x86_64 uses x87 80-bit -- so it is the only
  # runner that can adjudicate the quad-precision codegen (audit #H4), which
  # was deferred twice for want of exactly this.
  linux-aarch64:
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System info
        run: |
          echo "=== Architecture ==="
          uname -a
          echo "=== Toolchain ==="
          rustc --version
          cc --version || true
      - name: Fetch
        run: cargo fetch
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose

  macos-homebrew:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System info
        run: |
          echo "=== Architecture ==="
          uname -a
          arch
          echo "=== Toolchain ==="
          rustc --version
          cargo --version
          cc --version || true
          as -version || true
          echo "=== Xcode ==="
          xcodebuild -version || true
      - name: Fetch
        run: cargo fetch
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose
      - name: Run cc tests (detailed)
        if: failure()
        run: |
          echo "=== Re-running cc tests with more detail ==="
          cargo test --release -p posixutils-cc --verbose -- --nocapture --test-threads=1 2>&1 | head -500

  # Windows: the crates in WINDOWS_CRATES, built and tested with MSVC.
  windows:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System info
        run: |
          echo "=== Toolchain ==="
          rustc --version --verbose
          cargo --version
      - name: Build
        run: cargo build --release --verbose $WINDOWS_CRATES
      - name: Run tests
        run: cargo test --release --verbose $WINDOWS_CRATES
