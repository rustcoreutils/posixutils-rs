name: Weekly coverage

on:
  schedule:
    # GitHub Actions cron is UTC.
    # Sundays 05:00 UTC = ~12:00am ET (standard time) / ~1:00am ET (daylight time).
    - cron: "0 5 * * 0"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system deps (awk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk
          command -v awk
          awk --version | head -n 1

      # Run the suite once; both reports below read this run's profiles.
      # --no-fail-fast so one failing crate does not hide the others.
      - name: Run tests with coverage (workspace)
        run: cargo llvm-cov --workspace --all-features --no-fail-fast --no-report

      # A utility run under a umask that denies owner read writes its profile
      # under that umask too, and llvm-profdata crashes on an unreadable input.
      - name: Make every profile readable
        run: find target/llvm-cov-target -name '*.profraw' ! -perm -u=r -exec chmod u+r {} +

      # A utility run under a small `ulimit -f` leaves a truncated profile;
      # `--failure-mode all` skips such a file with a warning.
      - name: Generate LCOV
        run: cargo llvm-cov report --failure-mode all --lcov --output-path lcov.info

      - name: Generate HTML report
        run: cargo llvm-cov report --failure-mode all --html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
