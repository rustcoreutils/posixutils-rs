[package]
name = "posixutils-pax"
version = "0.8.0"
authors = ["Jeff Garzik"]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Run all tests including those that require special environments
posixutils_test_all = []
# Tests that require root privileges (mknod, device creation)
requires_root = ["posixutils_test_all"]

[dependencies]
libc.workspace = true
clap.workspace = true
gettext-rs.workspace = true
# Outside CLAUDE.md's preferred set (std, clap, libc, regex, chrono), and kept
# deliberately: it backs `-z`, which is not in POSIX pax, but also the
# transparent gzip detection on read (main.rs `is_gzip(peek) || args.gzip`), so
# dropping it would stop `.tar.gz` archives being readable at all rather than
# merely removing a flag. Reviewed and retained; do not re-flag without
# addressing the read path. flate2 rather than libflate because xform already
# requires it, so pax's gzip support costs no additional crates.
flate2 = "1"
plib = { path = "../plib" }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[[bin]]
name = "pax"
path = "./main.rs"

