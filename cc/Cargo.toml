[package]
name = "posixutils-cc"
version = "0.8.0"
authors = ["Jeff Garzik"]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bitflags = "2"
clap.workspace = true
gettext-rs.workspace = true
# cflow analyzes object files as well as source (POSIX cflow INPUT FILES).
object = { version = "0.35", default-features = false, features = ["read", "std"] }
plib = { path = "../plib" }
# cflow shells out to lex/yacc for .l/.y operands and needs a scratch directory.
tempfile.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# Enable full compile matrix (4 configs) instead of default single config (-O -g)
test_matrix = []

[lib]
name = "posixutils_cc"
path = "./lib.rs"

[[bin]]
name = "c17"
path = "./main.rs"

[[bin]]
name = "cflow"
path = "./cflow.rs"

[[bin]]
name = "ctags"
path = "./ctags.rs"

[[bin]]
name = "cxref"
path = "./cxref.rs"

