[package]
name = "posixutils-man"
version = "0.8.0"
authors = ["Jeff Garzik"]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# gzip is the only compression used for installed manual pages. flate2 is
# already in the workspace dependency graph (pax, xform), so this adds no new
# crate -- and it replaces a fork+exec of zcat per page.
flate2 = "1"
clap = { workspace = true, features = ["env"] }
gettext-rs.workspace = true
libc.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["unstable-locales"] }
plib = { path = "../plib" }
regex.workspace = true
terminfo = "0.9"
unicode-width.workspace = true

[dev-dependencies]

[lints]
workspace = true

[[bin]]
name = "man"
path = "./man.rs"
