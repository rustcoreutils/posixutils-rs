[package]
name = "posixutils-text"
version = "0.8.0"
authors = ["Jeff Garzik"]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
plib = { path = "../plib" }
clap.workspace = true
gettext-rs.workspace = true
regex.workspace = true
chrono.workspace = true
libc.workspace = true
thiserror.workspace = true
diff = "0.1"

[dev-dependencies]
# `fork`/`timeout` (both on by default) exist to run each case in a subprocess;
# the head property tests use a plain TestRunner and time out via
# mpsc::recv_timeout instead, so those features only cost crates (rusty-fork,
# wait-timeout, quick-error, and tempfile -> rustix). `bit-set` is kept: it is
# the default shrinker state.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
rand = "0.8"

[lints]
workspace = true

[[bin]]
name = "asa"
path = "./asa.rs"

[[bin]]
name = "comm"
path = "./comm.rs"

[[bin]]
name = "unexpand"
path = "./unexpand.rs"

[[bin]]
name = "csplit"
path = "./csplit.rs"

