[package]
name = "plib"
version = "0.9.0"
authors = ["Jeff Garzik"]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cfg-if = "1.0"
libc.workspace = true
errno.workspace = true
gettext-rs.workspace = true
# Parses the date-time operand of touch -d and date -d (date_arg.rs), and
# formats times on Windows, which has no strftime(3) of its own (timefmt.rs).
chrono.workspace = true
# Reads which options take an argument from a command's definition (optarg.rs).
clap.workspace = true

# Race-free directory access shared with the tree walk: madefs's emptiness check
# (madefs.rs). ftw is Unix-only, as madefs is.
[target.'cfg(unix)'.dependencies]
ftw = { path = "../ftw" }

# Compiles the vendored musl regex for a Windows target (see build.rs). Not
# under [target.'cfg(windows)'.build-dependencies]: Cargo matches that against
# the host, so a Linux host cross-building for Windows would not get it.
[build-dependencies]
cc = "1"

[features]
# Instrumentation only tests read, across crates: enabled by the [dev-dependencies] of the
# crates whose tests use it, so release builds never carry it.
test-hooks = []

[lints]
workspace = true

[lib]
doctest = false
